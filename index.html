<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pitlane — Email Editor</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#e8e8e4;color:#1a1a1a;height:100vh;overflow:hidden}
:root{--sw:238px;--pw:282px;--th:52px;--ac:#E8401C;--ac2:#c73516;--bg:#fff;--bg2:#f6f6f3;--bd:rgba(0,0,0,.11);--bd2:rgba(0,0,0,.24);--t:#1a1a1a;--t2:#666;--t3:#999}
.app{display:grid;grid-template-rows:var(--th) 1fr;grid-template-columns:var(--sw) 1fr var(--pw);height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 16px;background:#111;border-bottom:1px solid rgba(255,255,255,.07);z-index:20}
.logo{display:flex;align-items:center;gap:9px;margin-right:8px}
.lw{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.3px}
.lw b{color:#E8401C}
.vsep{width:1px;height:22px;background:rgba(255,255,255,.14);margin:0 2px}
.tbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s}
.tbtn:hover{background:rgba(255,255,255,.09);color:#fff}
.tbtn-ac{background:#E8401C;color:#fff;border-color:transparent}
.tbtn-ac:hover{background:#c73516}
.fx{flex:1}
.sidebar{grid-column:1;grid-row:2;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.stabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.stab{flex:1;min-width:0;padding:9px 2px;font-size:10.5px;text-align:center;cursor:pointer;border:none;background:none;color:var(--t2);border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap}
.stab.on{color:#E8401C;border-bottom-color:#E8401C;font-weight:600}
.sbody{flex:1;overflow-y:auto;padding:11px}
.sh{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.sh:first-child{margin-top:0}
.bitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;border:1px solid var(--bd);background:#fff;margin-bottom:5px;cursor:grab;font-size:12px;color:var(--t);user-select:none;transition:all .12s}
.bitem:hover{background:var(--bg2);border-color:var(--bd2)}
.bitem:active{cursor:grabbing;opacity:.55}
.bitem i{font-size:15px;color:var(--t2)}
/* module cards */
.mcat{font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--bd)}
.mcat:first-child{margin-top:0}
.mcard{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px;cursor:pointer;transition:all .14s;background:#fff}
.mcard:hover{border-color:#E8401C;box-shadow:0 2px 12px rgba(232,64,28,.12)}
.mcard-thumb{height:72px;overflow:hidden;position:relative}
.mcard-label{display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border-top:1px solid var(--bd)}
.mcard-name{font-size:11px;font-weight:500;color:var(--t)}
.mcard-tag{font-size:9px;color:var(--t3);background:var(--bg2);padding:1px 6px;border-radius:10px}
/* template & creation cards */
.tcard{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px;cursor:pointer;transition:border-color .12s}
.tcard:hover{border-color:#E8401C}
.tthumb{height:60px;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--bg2)}
.tbar{border-radius:2px;height:9px}
.tlabel{font-size:11px;padding:5px 8px;color:var(--t2);font-weight:500}
.ccard{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:8px;transition:border-color .12s}
.ccard:hover{border-color:#E8401C}
.cmeta{padding:7px 9px 0;display:flex;align-items:center;gap:6px}
.cname{font-size:12px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cacts{display:flex;gap:3px;flex-shrink:0}
.cact{width:22px;height:22px;border-radius:5px;border:1px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t2);font-family:inherit}
.cact:hover{background:var(--bg2);color:var(--t)}
.cact.del:hover{background:#fff0ed;color:#E8401C;border-color:#ffd9d0}
.cdate{padding:3px 9px 7px;font-size:10px;color:var(--t3)}
.cempty{text-align:center;padding:28px 12px}
.cempty i{font-size:28px;display:block;margin-bottom:8px;opacity:.35;color:var(--t2)}
.cempty p{font-size:12px;color:var(--t3);line-height:1.6}
.nbadge{display:inline-block;background:#E8401C;color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;font-weight:700;margin-left:3px;vertical-align:middle}
.canvas{grid-column:2;grid-row:2;overflow-y:auto;padding:20px;display:flex;flex-direction:column;align-items:center}
.ctop{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.vtog{display:flex;border:1px solid var(--bd2);border-radius:7px;overflow:hidden}
.vtab{padding:5px 12px;font-size:11px;cursor:pointer;border:none;background:none;color:var(--t2);font-family:inherit}
.vtab.on{background:#E8401C;color:#fff}
.ewrap{background:#fff;border-radius:4px;box-shadow:0 2px 18px rgba(0,0,0,.11);position:relative;transition:width .22s}
.dzone{width:100%;display:flex;align-items:center;justify-content:center;border:2px dashed transparent;transition:all .14s;border-radius:3px}
.dzone.over{border-color:#E8401C;background:rgba(232,64,28,.05);min-height:40px}
.dzone.over::after{content:"Deposer ici";font-size:11px;color:#E8401C}
.eblock{position:relative;cursor:pointer}
.eblock:hover{outline:2px solid rgba(232,64,28,.3);outline-offset:-1px}
.eblock.sel{outline:2px solid #E8401C;outline-offset:-1px}
.bctrl{position:absolute;right:7px;top:7px;display:none;gap:3px;z-index:5}
.eblock:hover .bctrl,.eblock.sel .bctrl{display:flex}
.cbtn{width:25px;height:25px;border-radius:5px;background:#1a1a1a;color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.cbtn.red{background:#E24B4A}
.cbtn:hover{opacity:.78}
.eempty{text-align:center;padding:60px 24px}
.eempty i{font-size:38px;color:#ccc;display:block;margin-bottom:12px}
.eempty p{font-size:13px;color:#aaa;line-height:1.6}
.panel{grid-column:3;grid-row:2;background:#fff;border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.ph{padding:10px 14px;border-bottom:1px solid var(--bd);font-size:10px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.pb{flex:1;overflow-y:auto;padding:14px}
.fl{font-size:11px;color:var(--t2);margin-bottom:3px;display:block;margin-top:2px}
.fi{width:100%;padding:7px 10px;border:1px solid var(--bd2);border-radius:7px;font-size:12px;color:var(--t);background:#fff;margin-bottom:10px;outline:none;font-family:inherit}
.fi:focus{border-color:#E8401C;box-shadow:0 0 0 2px rgba(232,64,28,.11)}
textarea.fi{resize:vertical}
select.fi{appearance:none;cursor:pointer}
.crow{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.csw{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd2);overflow:hidden;flex-shrink:0;cursor:pointer}
.csw input{width:200%;height:200%;margin:-25%;cursor:pointer;border:none}
.nop{text-align:center;padding:24px 12px}
.nop i{font-size:28px;color:#ccc;display:block;margin-bottom:10px}
.nop p{font-size:12px;color:var(--t3);line-height:1.6}
.tpill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;background:#fff0ed;color:#c73516;font-size:11px;font-weight:500;cursor:pointer;border:none;font-family:inherit}
.tpill:hover{background:#ffd9d0}
.mlist{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.qbtn-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.qbtn{flex:1;min-width:0;padding:5px 4px;border-radius:6px;border:1px solid var(--bd2);background:transparent;color:var(--t2);font-size:11px;cursor:pointer;font-family:inherit;text-align:center}
.qbtn.on{border-color:#E8401C;background:#fff0ed;color:#E8401C}
.qbtn:hover:not(.on){background:var(--bg2)}
.info-box{font-size:11px;color:var(--t3);line-height:1.6;padding:8px;background:var(--bg2);border-radius:6px;margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:24px;width:720px;max-height:85vh;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-sm{background:#fff;border-radius:12px;padding:24px;width:400px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.mh{font-size:16px;font-weight:600;margin-bottom:16px}
.mh2{font-size:13px;color:var(--t2);margin-bottom:14px;margin-top:-10px}
.mtabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:16px}
.mtab{padding:8px 14px;font-size:12px;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2);background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.mtab.on{color:#E8401C;border-bottom-color:#E8401C}
.modal pre{background:var(--bg2);border-radius:8px;padding:14px;font-size:11px;font-family:monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:400px}
.mfoot{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.sinput{width:100%;padding:9px 12px;border:1px solid var(--bd2);border-radius:8px;font-size:14px;color:var(--t);background:#fff;outline:none;font-family:inherit;margin-bottom:14px}
.sinput:focus{border-color:#E8401C;box-shadow:0 0 0 2px rgba(232,64,28,.11)}
.sbtn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;border:1px solid var(--bd2);background:transparent;color:var(--t);font-size:12px;cursor:pointer;font-family:inherit}
.sbtn:hover{background:var(--bg2)}
.sbtn-ac{background:#E8401C;color:#fff;border-color:transparent}
.sbtn-ac:hover{background:#c73516}
.notif{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;font-family:inherit;white-space:nowrap}
.notif.show{opacity:1}
</style>
</head>
<body>

<script type="text/babel">

  footer:{text:'© 2024 autobiz — Tous droits reserves.',unsubscribe:'Se desabonner',bg:'#f5f5f5',color:'#888888',fontSize:12,align:'center'},

   MODULE LIBRARY — HTML modules ready to insert
   Each module has: id, name, category, tag, html (export), preview (inline JSX render)
================================================================ */

  /* ---- HERO ---- */
  {id:'hero-dark',name:'Hero sombre',cat:'Hero',tag:'Impactant',
   html:`<table width="100%" cellpadding="0" cellspacing="0" style="background:#111111"><tr><td style="padding:56px 40px;text-align:center"><p style="margin:0 0 8px;font-family:Arial,sans-serif;font-size:12px;font-weight:600;color:#E8401C;letter-spacing:2px;text-transform:uppercase">Nouveaute</p><h1 style="margin:0 0 16px;font-family:Arial,sans-serif;font-size:36px;font-weight:800;color:#ffffff;line-height:1.15">Votre titre<br/>percutant ici</h1><p style="margin:0 0 28px;font-family:Arial,sans-serif;font-size:16px;color:rgba(255,255,255,.65);line-height:1.6">Une accroche courte qui donne envie de cliquer. Simple, directe, efficace.</p><a href="#" style="display:inline-block;background:#E8401C;color:#fff;padding:14px 32px;border-radius:6px;font-family:Arial,sans-serif;font-size:15px;font-weight:700;text-decoration:none">Decouvrir maintenant</a></td></tr></table>`,

  {id:'hero-light',name:'Hero clair',cat:'Hero',tag:'Elegant',

   preview:<div style={{background:'#fff',borderBottom:'3px solid #E8401C',padding:'28px 20px',textAlign:'center'}}><div style={{fontSize:18,fontWeight:800,color:'#1a1a1a',lineHeight:1.2,marginBottom:8}}>Titre principal email</div><div style={{fontSize:12,color:'#666',marginBottom:12}}>Votre message cle.</div><span style={{display:'inline-block',background:'#1a1a1a',color:'#fff',padding:'6px 16px',borderRadius:4,fontSize:11,fontWeight:700}}>En savoir plus</span></div>
  },

  {id:'hero-gradient',name:'Hero degrade',cat:'Hero',tag:'Moderne',
   html:`<table width="100%" cellpadding="0" cellspacing="0" style="background:#1a0533"><tr><td style="padding:52px 40px;text-align:center;background:linear-gradient(135deg,#1a0533 0%,#E8401C 100%)"><p style="margin:0 0 12px;font-family:Arial,sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:3px;text-transform:uppercase">Edition speciale</p><h1 style="margin:0 0 16px;font-family:Arial,sans-serif;font-size:34px;font-weight:800;color:#ffffff;line-height:1.2">Le futur commence<br/>aujourd'hui</h1><p style="margin:0 0 26px;font-family:Arial,sans-serif;font-size:15px;color:rgba(255,255,255,.75);line-height:1.65">Rejoignez des milliers de professionnels qui font confiance a notre solution.</p><a href="#" style="display:inline-block;background:#ffffff;color:#1a0533;padding:13px 32px;border-radius:30px;font-family:Arial,sans-serif;font-size:14px;font-weight:700;text-decoration:none">Commencer maintenant</a></td></tr></table>`,
   preview:<div style={{background:'linear-gradient(135deg,#1a0533,#E8401C)',padding:'30px 20px',textAlign:'center'}}><div style={{fontSize:9,color:'rgba(255,255,255,.6)',letterSpacing:3,textTransform:'uppercase',marginBottom:6}}>Edition speciale</div><div style={{fontSize:18,fontWeight:800,color:'#fff',lineHeight:1.2,marginBottom:8}}>Le futur commence aujourd'hui</div><span style={{display:'inline-block',background:'#fff',color:'#1a0533',padding:'6px 18px',borderRadius:30,fontSize:11,fontWeight:700}}>Commencer</span></div>
  },

function renderBlock(b){
  const p=b.props;
  switch(b.type){
    case'header':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="background:${p.bg};padding:36px 32px;text-align:${p.align}"><h1 style="margin:0;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};font-weight:700">${p.title}</h1>${p.subtitle?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;color:${p.color};opacity:.85;font-size:15px">${p.subtitle}</p>`:''}</td></tr></table>`;
    case'text':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:${p.padding}px 32px"><p style="margin:0;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};line-height:1.7;text-align:${p.align};white-space:pre-line">${p.content}</p></td></tr></table>`;
    case'logo':{
      const imgStyle=`max-width:${p.width||'180px'};height:auto;display:block;${fmtAl(p.align||'center')}`;
      const img=`<img src="${p.src}" alt="${p.alt||'Logo'}" style="${imgStyle}"/>`;
      const inner=p.link?`<a href="${p.link}" style="display:block;text-decoration:none">${img}</a>`:img;
      return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||20}px 32px;text-align:${p.align||'center'}">${inner}</td></tr></table>`;
    }
    case'image':{
      const cols=Number(p.cols)||1;
      const r=Number(p.radius)||0;
      const rStyle=r?`border-radius:${r}px;overflow:hidden;`:'';
      const gap=Number(p.gap)||8;
      if(cols===1){
        const imgStyle=`max-width:${p.width||'100%'};height:auto;display:block;${fmtAl(p.align||'center')};${rStyle}`;
        const img=`<img src="${p.src}" alt="${p.alt||''}" style="${imgStyle}"/>`;
        const linked=p.link?`<a href="${p.link}" style="display:block;text-decoration:none">${img}</a>`:img;
        const caption=p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:${p.align||'center'};font-style:italic">${p.caption}</p>`:'';
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0">${linked}${caption}</td></tr></table>`;
      }
      if(cols===2){
        const w=`calc(50% - ${gap/2}px)`;
        const mk=(src,idx)=>`<td width="50%" style="padding:${idx===0?`0 ${gap/2}px 0 0`:`0 0 0 ${gap/2}px`}"><img src="${src}" alt="" style="width:100%;height:auto;display:block;${rStyle}"/></td>`;
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0"><table width="100%" cellpadding="0" cellspacing="0"><tr>${mk(p.src,0)}${mk(p.src2||p.src,1)}</tr></table>${p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:center;font-style:italic">${p.caption}</p>`:''}</td></tr></table>`;
      }
      if(cols===3){
        const g=Math.round(gap*2/3);
        const mk3=(src,idx)=>`<td width="33%" style="padding:${idx===0?`0 ${g}px 0 0`:idx===2?`0 0 0 ${g}px`:`0 ${g/2}px`}"><img src="${src}" alt="" style="width:100%;height:auto;display:block;${rStyle}"/></td>`;
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0"><table width="100%" cellpadding="0" cellspacing="0"><tr>${mk3(p.src,0)}${mk3(p.src2||p.src,1)}${mk3(p.src3||p.src,2)}</tr></table>${p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:center;font-style:italic">${p.caption}</p>`:''}</td></tr></table>`;
      }
      return'';
    }
    case'button':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:16px 32px;text-align:${p.align}"><a href="${p.url}" style="display:inline-block;background:${p.bg};color:${p.color};padding:12px 28px;border-radius:${p.borderRadius}px;font-size:${p.fontSize}px;font-family:Arial,sans-serif;text-decoration:none;font-weight:600">${p.label}</a></td></tr></table>`;
    case'divider':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:${p.padding}px 32px"><hr style="border:none;border-top:${p.thickness}px solid ${p.color}"/></td></tr></table>`;
    case'spacer':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="height:${p.height}px;font-size:0;line-height:0">&nbsp;</td></tr></table>`;
    case'columns':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td width="50%" style="padding:24px 16px 24px 32px;vertical-align:top;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};white-space:pre-line">${p.col1}</td><td width="50%" style="padding:24px 32px 24px 16px;vertical-align:top;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};white-space:pre-line">${p.col2}</td></tr></table>`;
    case'social':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td style="padding:16px 32px;text-align:${p.align}">${['twitter','linkedin','facebook','instagram'].map(s=>`<a href="${p[s]}" style="display:inline-block;margin:0 5px;color:${p.color};font-family:Arial,sans-serif;font-size:13px;text-decoration:none;border:1px solid ${p.color};padding:5px 12px;border-radius:4px">${s[0].toUpperCase()+s.slice(1)}</a>`).join('')}</td></tr></table>`;
    case'footer':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td style="padding:20px 32px;text-align:${p.align}"><p style="margin:0;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color}">${p.text}</p><p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:11px"><a href="#" style="color:${p.color};text-decoration:underline">${p.unsubscribe}</a></p></td></tr></table>`;
    case'html':return p.code||'';
    default:return'';
  }
}

function buildEmail(blocks,settings={},preview=false){
  const vars={prenom:'Sophie',nom:'Martin',email:'sophie@exemple.fr',entreprise:'Acme',desabonnement:'Se desabonner'};
  const bg=settings.bgColor||'#f0f0f0';
  const preH=settings.preheader?`<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px">${settings.preheader}&nbsp;</div>`:'';
  let html=`<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8"/>\n<title>${settings.subject||'Email'}</title>\n</head>\n<body style="margin:0;padding:0;background:${bg}">\n${preH}\n<table width="100%" style="background:${bg}" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:20px 0">\n<table width="600" style="background:#ffffff" cellpadding="0" cellspacing="0">\n`;
  html+=blocks.map(b=>`<tr><td>${renderBlock(b)}</td></tr>`).join('\n');
  html+=`\n</table>\n</td></tr></table>\n</body>\n</html>`;
  if(preview)Object.entries(vars).forEach(([k,v])=>{html=html.replaceAll(`{{${k}}}`,v);});
  return html;
}

      {idx>0&&<button className="cbtn" title="Monter" onClick={e=>{e.stopPropagation();onUp(block.id)}}><i className="ti ti-arrow-up"/></button>}
      {idx<total-1&&<button className="cbtn" title="Descendre" onClick={e=>{e.stopPropagation();onDown(block.id)}}><i className="ti ti-arrow-down"/></button>}
      <button className="cbtn" title="Dupliquer" onClick={e=>{e.stopPropagation();onDup(block.id)}}><i className="ti ti-copy"/></button>
      <button className="cbtn red" title="Supprimer" onClick={e=>{e.stopPropagation();onDel(block.id)}}><i className="ti ti-trash"/></button>
    </div>
  </div>;
}

function TextareaField({label,val,onChange,rows=3}){return<div><label className="fl">{label}</label><textarea className="fi" rows={rows} value={val} onChange={e=>onChange(e.target.value)}/></div>;}

      {tab==='json'&&<><button className="sbtn" onClick={()=>copy(json)}><i className="ti ti-copy"/>Copier</button><button className="sbtn sbtn-ac" onClick={()=>dl(json,'email.json','application/json')}><i className="ti ti-download"/>Telecharger</button></>}

function App(){
  const [blocks,setBlocks]=useState(()=>TMPLS[0].blocks.map(b=>cloneB(b)));
  const [settings,setSettings]=useState({subject:'',preheader:'',bgColor:'#f0f0f0'});
  const [sel,setSel]=useState(null);
  const [drag,setDrag]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  const [showExport,setShowExport]=useState(false);
  const [showSave,setShowSave]=useState(false);
  const [sTab,setSTab]=useState('blocs');
  const [pTab,setPTab]=useState('props');
  const [view,setView]=useState('desktop');
  const [notif,setNotif]=useState('');
  const [creations,setCreations]=useState(()=>lsLoad());
  const timerRef=useRef();

  const toast=msg=>{setNotif(msg);clearTimeout(timerRef.current);timerRef.current=setTimeout(()=>setNotif(''),2400);};
  const selBlock=blocks.find(b=>b.id===sel)||null;

  const addBlock=(type,atIdx)=>{const nb={id:uid(),type,props:{...DEF[type]}};setBlocks(prev=>{const a=[...prev];a.splice(atIdx!=null?atIdx:a.length,0,nb);return a;});setSel(nb.id);};
  const insertModule=m=>{const nb={id:uid(),type:'html',props:{code:m.html}};setBlocks(p=>[...p,nb]);setSel(nb.id);toast(`Module "${m.name}" ajoute`);};
  const loadTpl=tpl=>{setBlocks(tpl.blocks.map(b=>cloneB(b)));setSel(null);toast('Template charge');};
  const delBlock=id=>{setBlocks(p=>p.filter(b=>b.id!==id));if(sel===id)setSel(null);};
  const updBlock=(id,props)=>setBlocks(p=>p.map(b=>b.id===id?{...b,props}:b));
  const dupBlock=id=>{const i=blocks.findIndex(b=>b.id===id);if(i<0)return;const d=cloneB(blocks[i]);setBlocks(p=>{const a=[...p];a.splice(i+1,0,d);return a;});setSel(d.id);toast('Bloc duplique');};
  const moveUp=id=>setBlocks(p=>{const i=p.findIndex(b=>b.id===id);if(i<=0)return p;const a=[...p];[a[i-1],a[i]]=[a[i],a[i-1]];return a;});
  const moveDown=id=>setBlocks(p=>{const i=p.findIndex(b=>b.id===id);if(i>=p.length-1)return p;const a=[...p];[a[i],a[i+1]]=[a[i+1],a[i]];return a;});
  const handleSave=name=>{const e={id:String(Date.now()),name,savedAt:Date.now(),blocks:blocks.map(b=>cloneB(b)),settings};const u=[...creations,e];setCreations(u);lsSave(u);setShowSave(false);toast(`"${name}" enregistre !`);};
  const handleLoad=c=>{if(blocks.length>0&&!window.confirm("Remplacer l'email en cours ?"))return;setBlocks(c.blocks.map(b=>cloneB(b)));if(c.settings)setSettings(c.settings);setSel(null);setSTab('blocs');toast(`"${c.name}" ouvert`);};
  const handleDelete=id=>{const u=creations.filter(c=>c.id!==id);setCreations(u);lsSave(u);};
  const onDrop=at=>{if(drag){addBlock(drag,at);setDrag(null);setDragOver(null);}};

  return<div className="app">
    <header className="topbar">
      <div className="logo">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect width="30" height="30" rx="7" fill="#E8401C"/><path d="M5 22 L9 10 L14 17 L18 11 L25 22" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/><circle cx="25" cy="22" r="2.2" fill="white"/></svg>
        <span className="lw">Pit<b>lane</b></span>
      </div>
      <div className="vsep"/>
      <button className="tbtn" onClick={()=>{if(!blocks.length||window.confirm('Vider le canvas ?')){setBlocks([]);setSel(null);}}}><i className="ti ti-trash"/>Vider</button>
      <button className="tbtn" onClick={()=>setShowSave(true)}><i className="ti ti-device-floppy"/>Enregistrer</button>
      <div className="fx"/>
      <span style={{fontSize:11,color:'rgba(255,255,255,.35)'}}>{blocks.length} bloc{blocks.length!==1?'s':''}</span>
      <button className="tbtn tbtn-ac" onClick={()=>setShowExport(true)}><i className="ti ti-download"/>Exporter HTML</button>
    </header>

    <aside className="sidebar">
      <div className="stabs">
        <button className={`stab${sTab==='blocs'?' on':''}`} onClick={()=>setSTab('blocs')}>Blocs</button>
        <button className={`stab${sTab==='modules'?' on':''}`} onClick={()=>setSTab('modules')}><i className="ti ti-layout-grid" style={{fontSize:11,verticalAlign:-1,marginRight:2}}/>Modules</button>
        <button className={`stab${sTab==='templates'?' on':''}`} onClick={()=>setSTab('templates')}>Tmpls</button>
        <button className={`stab${sTab==='creations'?' on':''}`} onClick={()=>setSTab('creations')}>Mes emails{creations.length>0&&<span className="nbadge">{creations.length}</span>}</button>
      </div>
      <div className="sbody">
        {sTab==='blocs'&&<>
          <div className="sh">Elements</div>
          {BTYPES.map(bt=><div key={bt.type} className="bitem" draggable onDragStart={()=>setDrag(bt.type)} onDragEnd={()=>{setDrag(null);setDragOver(null);}} onClick={()=>addBlock(bt.type)}><i className={`ti ${bt.icon}`}/>{bt.label}</div>)}
        </>}
        {sTab==='modules'&&<ModulesTab onInsert={insertModule}/>}
        {sTab==='templates'&&<>
          <div className="sh">Templates autobiz</div>
          {TMPLS.map(t=><div key={t.name} className="tcard" onClick={()=>loadTpl(t)}><div className="tthumb"><div className="tbar" style={{background:t.color,width:'100%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'78%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'58%'}}/><div className="tbar" style={{background:t.color,width:52}}/></div><div className="tlabel">{t.name}</div></div>)}
        </>}
        {sTab==='creations'&&<CreationsTab creations={creations} onLoad={handleLoad} onDelete={handleDelete} toast={toast}/>}
      </div>
    </aside>

    <main className="canvas" onClick={()=>setSel(null)}>
      <div className="ctop">
        <span style={{fontSize:11,color:'#888'}}>{view==='desktop'?'600px':'375px'} — {view==='desktop'?'Desktop':'Mobile'}</span>
        <div className="vtog">
          <button className={`vtab${view==='desktop'?' on':''}`} onClick={()=>setView('desktop')}><i className="ti ti-device-laptop" style={{fontSize:13}}/> Desktop</button>
          <button className={`vtab${view==='mobile'?' on':''}`} onClick={()=>setView('mobile')}><i className="ti ti-device-mobile" style={{fontSize:13}}/> Mobile</button>
        </div>
      </div>
      <div className="ewrap" style={{width:view==='desktop'?600:375,minHeight:400}}>
        {!blocks.length
          ?<div className="eempty"><i className="ti ti-layout-navbar"/><p>Glissez un bloc ici ou cliquez dans la sidebar pour commencer</p></div>
          :<>
            <div className={`dzone${dragOver===0?' over':''}`} style={{minHeight:drag?38:6}} onDragOver={e=>{e.preventDefault();setDragOver(0)}} onDragLeave={()=>setDragOver(null)} onDrop={()=>onDrop(0)}/>
            {blocks.map((b,i)=><React.Fragment key={b.id}>
              <BView block={b} sel={sel===b.id} onSel={setSel} onDel={delBlock} onUp={moveUp} onDown={moveDown} onDup={dupBlock} idx={i} total={blocks.length}/>
              <div className={`dzone${dragOver===i+1?' over':''}`} style={{minHeight:drag?38:6}} onDragOver={e=>{e.preventDefault();setDragOver(i+1)}} onDragLeave={()=>setDragOver(null)} onDrop={()=>onDrop(i+1)}/>
            </React.Fragment>)}
          </>
        }
      </div>
    </main>

    <aside className="panel">
      <div style={{display:'flex',borderBottom:'1px solid var(--bd)',flexShrink:0}}>
        <button className={`stab${pTab==='props'?' on':''}`} style={{flex:1,padding:'9px 4px',fontSize:11}} onClick={()=>setPTab('props')}><i className="ti ti-settings" style={{fontSize:12,verticalAlign:-1,marginRight:3}}/>Proprietes</button>
        <button className={`stab${pTab==='vars'?' on':''}`} style={{flex:1,padding:'9px 4px',fontSize:11}} onClick={()=>setPTab('vars')}><i className="ti ti-braces" style={{fontSize:12,verticalAlign:-1,marginRight:3}}/>Variables CRM</button>
      </div>
      <div className="pb">
        {pTab==='props'&&(selBlock?<PropPanel block={selBlock} onChange={updBlock} toast={toast}/>:<EmailSettings settings={settings} onChange={setSettings}/>)}
        {pTab==='vars'&&<VarsPanel toast={toast}/>}
      </div>
    </aside>

    {showExport&&<ExportModal blocks={blocks} settings={settings} onClose={()=>setShowExport(false)}/>}
    {showSave&&<SaveModal onSave={handleSave} onClose={()=>setShowSave(false)}/>}
    <div className={`notif${notif?' show':''}`}>{notif}</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
