<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Pitlane Email Studio</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
/* --- VARIABLES & RESET --- */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#1f2937;height:100vh;width:100vw;overflow:hidden;line-height:1.5}
:root{
  --rail-w:72px; --sw:260px; --pw:300px; --th:56px;
  --ac:#E8401C; --ac-hover:#c73516; --ac-light:#fff0ed;
  --bg:#ffffff; --bg-alt:#f9fafb; --bg-hover:#f3f4f6;
  --bd:#e5e7eb; --bd-dark:#d1d5db;
  --t:#111827; --t2:#4b5563; --t3:#9ca3af;
  --radius:8px;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05)
}

/* --- SCROLLBARS --- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* --- LAYOUT --- */
.app{
  display:grid;
  grid-template-rows:var(--th) 1fr;
  grid-template-columns:var(--rail-w) var(--sw) 1fr var(--pw);
  height:100vh;
  width:100vw;
  overflow:hidden;
}

/* --- TOPBAR --- */
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;background:var(--bg);border-bottom:1px solid var(--bd);z-index:20;padding-right:20px}
.logo-box{width:var(--rail-w);height:100%;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top-title{margin-left:20px;font-size:16px;font-weight:600;color:var(--t);display:flex;align-items:center;gap:12px}
.save-status{font-size:12px;font-weight:400;color:var(--t3);display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}
.dot.saved{background:#10b981}

.vsep{width:1px;height:24px;background:var(--bd);margin:0 12px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:1px solid var(--bd-dark);background:transparent;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s ease}
.tbtn:hover{background:var(--bg-hover);color:var(--t)}
.tbtn-ac{background:var(--ac);color:#fff;border-color:transparent}
.tbtn-ac:hover{background:var(--ac-hover);color:#fff}
.fx{flex:1}

/* --- RAIL (Leftmost Nav) --- */
.rail{grid-column:1;grid-row:2;background:var(--bg);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:12px;z-index:15}
.rail-btn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;position:relative}
.rail-btn i{font-size:22px}
.rail-btn:hover{color:var(--t2);background:var(--bg-hover)}
.rail-btn.on{background:var(--ac-light);color:var(--ac)}
.rail-badge{position:absolute;top:2px;right:2px;background:var(--ac);color:#fff;font-size:9px;font-weight:700;padding:2px 4px;border-radius:10px;line-height:1}

/* --- SECONDARY SIDEBAR --- */
.sidebar{grid-column:2;grid-row:2;background:var(--bg-alt);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.s-header{padding:16px;flex-shrink:0}
.s-search{position:relative;width:100%}
.s-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:16px;pointer-events:none}
.s-search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--bd-dark);border-radius:8px;font-size:13px;background:var(--bg);outline:none;transition:border-color .15s}
.s-search input:focus{border-color:var(--ac)}
.sbody{flex:1;overflow-y:auto;padding:0 16px 24px}

/* Groups & Block Items */
.s-group{margin-bottom:24px}
.s-group-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.bitem{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;background:transparent;cursor:grab;font-size:13px;font-weight:500;color:var(--t2);user-select:none;transition:all .1s;margin-bottom:2px}
.bitem:hover{background:var(--bg);color:var(--t);box-shadow:var(--shadow-sm)}
.bitem:active{cursor:grabbing;opacity:.7}
.bitem i{font-size:18px;color:var(--t3)}
.bitem:hover i{color:var(--t2)}
.pro-badge{margin-left:auto;font-size:10px;font-weight:600;color:var(--ac);background:var(--ac-light);padding:2px 6px;border-radius:4px}

/* --- MODULES & CARDS --- */
.mcard{border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;cursor:pointer;transition:all .2s;background:var(--bg);box-shadow:var(--shadow-sm)}
.mcard:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.mcard-thumb{height:90px;overflow:hidden;position:relative;background:var(--bg-hover);border-bottom:1px solid var(--bd)}
.mcard-label{display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
.mcard-name{font-size:12px;font-weight:600;color:var(--t)}
.mcard-tag{font-size:10px;font-weight:500;color:var(--ac);background:var(--ac-light);padding:2px 8px;border-radius:12px}

/* --- TEMPLATES --- */
.tcard{border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-sm)}
.tcard:hover{border-color:var(--ac);transform:translateY(-1px);box-shadow:var(--shadow)}
.tthumb{height:70px;display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--bg-hover)}
.tbar{border-radius:3px;height:10px}
.tlabel{font-size:12px;padding:8px 12px;color:var(--t);font-weight:600;background:var(--bg);border-top:1px solid var(--bd)}

/* --- CREATIONS --- */
.ccard{border:1px solid var(--bd);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;transition:all .2s;background:var(--bg);box-shadow:var(--shadow-sm)}
.ccard:hover{border-color:var(--ac);box-shadow:var(--shadow)}
.cmeta{padding:10px 12px 4px;display:flex;align-items:center;gap:8px}
.cname{font-size:13px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.cacts{display:flex;gap:4px;flex-shrink:0}
.cact{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.cact:hover{background:var(--bg-hover);color:var(--t);border-color:var(--bd-dark)}
.cact.del:hover{background:var(--ac-light);color:var(--ac);border-color:#ffd9d0}
.cdate{padding:0 12px 10px;font-size:11px;color:var(--t3)}
.cempty{text-align:center;padding:40px 16px}
.cempty i{font-size:32px;display:block;margin-bottom:12px;color:var(--bd-dark)}
.cempty p{font-size:13px;color:var(--t2);line-height:1.5}

/* --- CANVAS CENTER --- */
.canvas{grid-column:3;grid-row:2;min-width:0;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;background:#f3f4f6}
.ctop{width:100%;max-width:640px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0}
.vtog{display:flex;background:var(--bg);border:1px solid var(--bd-dark);border-radius:8px;padding:2px;box-shadow:var(--shadow-sm)}
.vtab{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--t2);border-radius:6px;transition:all .15s}
.vtab.on{background:var(--ac);color:#fff;box-shadow:var(--shadow-sm)}
.ewrap{background:var(--bg);border-radius:8px;box-shadow:var(--shadow-lg);position:relative;transition:width .3s cubic-bezier(0.4, 0, 0.2, 1);min-height:600px;flex-shrink:0;margin-bottom:40px}
.dzone{width:100%;display:flex;align-items:center;justify-content:center;border:2px dashed transparent;transition:all .2s;border-radius:4px;margin:2px 0}
.dzone.over{border-color:var(--ac);background:var(--ac-light);min-height:48px;margin:8px 0}
.dzone.over::after{content:"Déposer le bloc ici";font-size:12px;font-weight:500;color:var(--ac)}
.eblock{position:relative;cursor:grab;transition:outline .15s}
.eblock:active{cursor:grabbing}
.eblock::before{content:'';position:absolute;inset:0;border:2px solid transparent;pointer-events:none;z-index:10;transition:border-color .15s}
.eblock:hover::before{border-color:rgba(232,64,28,.3)}
.eblock.sel::before{border-color:var(--ac)}
.bctrl{position:absolute;right:-44px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:20;opacity:0;transition:all .2s;background:var(--bg);padding:4px;border-radius:6px;box-shadow:var(--shadow)}
.eblock:hover .bctrl, .eblock.sel .bctrl{right:8px;opacity:1}
.cbtn{width:28px;height:28px;border-radius:4px;background:var(--bg-hover);color:var(--t2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.cbtn:hover{background:#e5e7eb;color:var(--t)}
.cbtn.red{color:#ef4444}
.cbtn.red:hover{background:#fee2e2}
.eempty{text-align:center;padding:80px 32px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eempty i{font-size:48px;color:var(--bd-dark);margin-bottom:16px}
.eempty p{font-size:14px;color:var(--t2);line-height:1.5;max-width:250px}

/* --- PANEL RIGHT --- */
.panel{grid-column:4;grid-row:2;background:var(--bg);border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:10;box-shadow:-2px 0 4px rgba(0,0,0,0.02)}
.ptabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--bg-alt)}
.ptab{flex:1;padding:12px 4px;font-size:12px;font-weight:600;color:var(--t2);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .15s}
.ptab:hover{color:var(--t)}
.ptab.on{color:var(--ac);border-bottom-color:var(--ac);background:var(--bg)}
.pb{flex:1;overflow-y:auto;padding:20px}
.fl{font-size:12px;font-weight:600;color:var(--t);margin-bottom:6px;display:block;margin-top:16px}
.fl:first-child{margin-top:0}
.fi{width:100%;padding:10px 12px;border:1px solid var(--bd-dark);border-radius:var(--radius);font-size:13px;color:var(--t);background:var(--bg);margin-bottom:0;outline:none;font-family:inherit;transition:all .15s}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-light)}
textarea.fi{resize:vertical;min-height:80px}
.crow{display:flex;align-items:center;gap:10px}
.csw{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--bd-dark);overflow:hidden;flex-shrink:0;cursor:pointer;box-shadow:var(--shadow-sm)}
.csw input{width:200%;height:200%;margin:-25%;cursor:pointer;border:none}
.qbtn-row{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{flex:1;min-width:0;padding:8px 6px;border-radius:6px;border:1px solid var(--bd-dark);background:var(--bg);color:var(--t2);font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.qbtn.on{border-color:var(--ac);background:var(--ac-light);color:var(--ac)}
.qbtn:hover:not(.on){background:var(--bg-hover)}
.info-box{font-size:12px;color:var(--t2);line-height:1.5;padding:12px;background:var(--bg-alt);border:1px solid var(--bd);border-radius:var(--radius);margin:16px 0}

/* --- MODALS & NOTIFS --- */
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.6);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s}
.modal{background:var(--bg);border-radius:12px;padding:32px;width:760px;max-height:90vh;overflow:auto;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1),0 10px 10px -5px rgba(0,0,0,0.04);animation:slideUp .2s}
.modal-sm{background:var(--bg);border-radius:12px;padding:32px;width:440px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.1);animation:slideUp .2s}
.mh{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--t)}
.mh2{font-size:14px;color:var(--t2);margin-bottom:20px}
.mtabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:20px;gap:16px}
.mtab{padding:10px 4px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;color:var(--t2);background:none;border-top:none;border-left:none;border-right:none;transition:all .15s}
.mtab.on{color:var(--ac);border-bottom-color:var(--ac)}
.modal pre{background:var(--bg-alt);border:1px solid var(--bd);border-radius:8px;padding:16px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-all;max-height:450px}
.mfoot{display:flex;gap:12px;margin-top:24px;justify-content:flex-end}
.sinput{width:100%;padding:12px 14px;border:1px solid var(--bd-dark);border-radius:8px;font-size:15px;color:var(--t);background:var(--bg);outline:none;transition:all .15s}
.sinput:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-light)}
.sbtn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:8px;border:1px solid var(--bd-dark);background:var(--bg);color:var(--t);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.sbtn:hover{background:var(--bg-hover)}
.sbtn-ac{background:var(--ac);color:#fff;border-color:transparent}
.sbtn-ac:hover{background:var(--ac-hover);box-shadow:var(--shadow-sm)}
.notif{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);pointer-events:none;box-shadow:var(--shadow-lg)}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

    case'text':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:${p.padding}px 32px"><p style="margin:0;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};line-height:1.7;text-align:${p.align};white-space:pre-line">${p.content}</p></td></tr></table>`;
    case'logo':{
      const imgStyle=`max-width:${p.width||'180px'};height:auto;display:block;${fmtAl(p.align||'center')}`;
      const img=`<img src="${p.src}" alt="${p.alt||'Logo'}" style="${imgStyle}"/>`;
      const inner=p.link?`<a href="${p.link}" style="display:block;text-decoration:none">${img}</a>`:img;
      return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||20}px 32px;text-align:${p.align||'center'}">${inner}</td></tr></table>`;
    }
    case'image':{
      const cols=Number(p.cols)||1; const r=Number(p.radius)||0; const rStyle=r?`border-radius:${r}px;overflow:hidden;`:''; const gap=Number(p.gap)||8;
      if(cols===1){
        const imgStyle=`max-width:${p.width||'100%'};height:auto;display:block;${fmtAl(p.align||'center')};${rStyle}`;
        const img=`<img src="${p.src}" alt="${p.alt||''}" style="${imgStyle}"/>`;
        const linked=p.link?`<a href="${p.link}" style="display:block;text-decoration:none">${img}</a>`:img;
        const caption=p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:${p.align||'center'};font-style:italic">${p.caption}</p>`:'';
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0">${linked}${caption}</td></tr></table>`;
      }
      if(cols===2){
        const w=`calc(50% - ${gap/2}px)`; const mk=(src,idx)=>`<td width="50%" style="padding:${idx===0?`0 ${gap/2}px 0 0`:`0 0 0 ${gap/2}px`}"><img src="${src}" alt="" style="width:100%;height:auto;display:block;${rStyle}"/></td>`;
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0"><table width="100%" cellpadding="0" cellspacing="0"><tr>${mk(p.src,0)}${mk(p.src2||p.src,1)}</tr></table>${p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:center;font-style:italic">${p.caption}</p>`:''}</td></tr></table>`;
      }
      if(cols===3){
        const g=Math.round(gap*2/3); const mk3=(src,idx)=>`<td width="33%" style="padding:${idx===0?`0 ${g}px 0 0`:idx===2?`0 0 0 ${g}px`:`0 ${g/2}px`}"><img src="${src}" alt="" style="width:100%;height:auto;display:block;${rStyle}"/></td>`;
        return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg||'#fff'}"><tr><td style="padding:${p.padding||0}px 0"><table width="100%" cellpadding="0" cellspacing="0"><tr>${mk3(p.src,0)}${mk3(p.src2||p.src,1)}${mk3(p.src3||p.src,2)}</tr></table>${p.caption?`<p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:12px;color:#999;text-align:center;font-style:italic">${p.caption}</p>`:''}</td></tr></table>`;
      }
      return'';
    }
    case'button':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:16px 32px;text-align:${p.align}"><a href="${p.url}" style="display:inline-block;background:${p.bg};color:${p.color};padding:12px 28px;border-radius:${p.borderRadius}px;font-size:${p.fontSize}px;font-family:Arial,sans-serif;text-decoration:none;font-weight:600">${p.label}</a></td></tr></table>`;
    case'divider':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="padding:${p.padding}px 32px"><hr style="border:none;border-top:${p.thickness}px solid ${p.color}"/></td></tr></table>`;
    case'spacer':return`<table width="100%" cellpadding="0" cellspacing="0"><tr><td style="height:${p.height}px;font-size:0;line-height:0">&nbsp;</td></tr></table>`;
    case'columns':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td width="50%" style="padding:24px 16px 24px 32px;vertical-align:top;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};white-space:pre-line">${p.col1}</td><td width="50%" style="padding:24px 32px 24px 16px;vertical-align:top;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color};white-space:pre-line">${p.col2}</td></tr></table>`;
    case'social':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td style="padding:16px 32px;text-align:${p.align}">${['twitter','linkedin','facebook','instagram'].map(s=>`<a href="${p[s]}" style="display:inline-block;margin:0 5px;color:${p.color};font-family:Arial,sans-serif;font-size:13px;text-decoration:none;border:1px solid ${p.color};padding:5px 12px;border-radius:4px">${s[0].toUpperCase()+s.slice(1)}</a>`).join('')}</td></tr></table>`;
    case'footer':return`<table width="100%" cellpadding="0" cellspacing="0" style="background:${p.bg}"><tr><td style="padding:20px 32px;text-align:${p.align}"><p style="margin:0;font-family:Arial,sans-serif;font-size:${p.fontSize}px;color:${p.color}">${p.text}</p><p style="margin:8px 0 0;font-family:Arial,sans-serif;font-size:11px"><a href="#" style="color:${p.color};text-decoration:underline">${p.unsubscribe}</a></p></td></tr></table>`;
    case'html':return p.code||'';
    default:return'';
  }
}

function buildEmail(blocks,settings={},preview=false){
  const vars={prenom:'Sophie',nom:'Martin',email:'sophie@exemple.fr',entreprise:'Acme',desabonnement:'Se désabonner'};
  const bg=settings.bgColor||'#f0f0f0';
  const preH=settings.preheader?`<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px">${settings.preheader}&nbsp;</div>`:'';
  let html=`<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8"/>\n<title>${settings.subject||'Email'}</title>\n</head>\n<body style="margin:0;padding:0;background:${bg}">\n${preH}\n<table width="100%" style="background:${bg}" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:20px 0">\n<table width="600" style="background:#ffffff" cellpadding="0" cellspacing="0">\n`;
  html+=blocks.map(b=>`<tr><td>${renderBlock(b)}</td></tr>`).join('\n');
  html+=`\n</table>\n</td></tr></table>\n</body>\n</html>`;
  if(preview)Object.entries(vars).forEach(([k,v])=>{html=html.replaceAll(`{{${k}}}`,v);});
  return html;
}

function BView({block,sel,onSel,onDel,onUp,onDown,onDup,idx,total,onDragStart}){
  const p=block.props;
  let inner=null;
  switch(block.type){
    case'header':inner=<div style={{background:p.bg,padding:'24px 18px',textAlign:p.align}}><div style={{color:p.color,fontSize:Math.min(p.fontSize,24),fontWeight:700,lineHeight:1.2}}>{p.title}</div>{p.subtitle&&<div style={{color:p.color,opacity:.85,marginTop:4,fontSize:12}}>{p.subtitle}</div>}</div>;break;
    case'text':inner=<div style={{padding:`${p.padding}px 18px`,color:p.color,fontSize:Math.min(p.fontSize,15),lineHeight:1.7,textAlign:p.align,whiteSpace:'pre-line'}}>{p.content}</div>;break;
    case'logo':{
      const ls={maxWidth:p.width||'180px',height:'auto',display:'block',margin:p.align==='center'?'0 auto':p.align==='right'?'0 0 0 auto':'0'};
      inner=<div style={{padding:`${p.padding||20}px 18px`,background:p.bg||'#fff',textAlign:p.align||'center',position:'relative'}}><img src={p.src} alt={p.alt||'Logo'} style={ls}/>{p.link&&<span style={{position:'absolute',bottom:4,right:4,background:'rgba(0,0,0,.5)',color:'#fff',fontSize:9,padding:'1px 5px',borderRadius:3}}>Lien</span>}</div>;break;
    }
    case'image':{
      const cols=Number(p.cols)||1; const r=Number(p.radius)||0; const rStyle=r?{borderRadius:r,overflow:'hidden'}:{};
      const singleImg=(src)=><img src={src} alt="" style={{width:'100%',height:'auto',display:'block',...rStyle}}/>;
      inner=<div style={{background:p.bg||'#fff',padding:`${p.padding||0}px 0`,position:'relative'}}>
        {cols===1&&<div style={{overflow:'hidden',...rStyle,...(p.width&&p.width!=='100%'?{maxWidth:p.width,margin:p.align==='center'?'0 auto':p.align==='right'?'0 0 0 auto':'0'}:{})}}><img src={p.src} alt={p.alt||''} style={{width:'100%',height:'auto',display:'block'}}/></div>}
        {cols===2&&<div style={{display:'flex',gap:Number(p.gap)||8,padding:'0 0'}}><div style={{flex:1,overflow:'hidden',...rStyle}}>{singleImg(p.src)}</div><div style={{flex:1,overflow:'hidden',...rStyle}}>{singleImg(p.src2||p.src)}</div></div>}
        {cols===3&&<div style={{display:'flex',gap:Number(p.gap)||8}}><div style={{flex:1,overflow:'hidden',...rStyle}}>{singleImg(p.src)}</div><div style={{flex:1,overflow:'hidden',...rStyle}}>{singleImg(p.src2||p.src)}</div><div style={{flex:1,overflow:'hidden',...rStyle}}>{singleImg(p.src3||p.src)}</div></div>}
        {p.caption&&<div style={{fontSize:11,color:'#999',fontStyle:'italic',textAlign:p.align||'center',padding:'5px 18px 0'}}>{p.caption}</div>}
      </div>;break;
    }
    case'button':inner=<div style={{padding:'10px 18px',textAlign:p.align}}><span style={{display:'inline-block',background:p.bg,color:p.color,padding:'8px 20px',borderRadius:p.borderRadius,fontSize:Math.min(p.fontSize,14),fontWeight:600}}>{p.label}</span></div>;break;
    case'divider':inner=<div style={{padding:`${p.padding}px 18px`}}><hr style={{border:'none',borderTop:`${p.thickness}px solid ${p.color}`}}/></div>;break;
    case'spacer':inner=<div style={{height:Math.min(p.height,40),background:'repeating-linear-gradient(45deg,#f8f8f8,#f8f8f8 4px,#fff 4px,#fff 10px)'}}>&nbsp;</div>;break;
    case'columns':inner=<div style={{display:'flex',background:p.bg}}><div style={{flex:1,padding:'12px 8px 12px 18px',color:p.color,fontSize:p.fontSize,borderRight:'1px dashed #e0e0e0',whiteSpace:'pre-line'}}>{p.col1}</div><div style={{flex:1,padding:'12px 18px 12px 8px',color:p.color,fontSize:p.fontSize,whiteSpace:'pre-line'}}>{p.col2}</div></div>;break;
    case'social':inner=<div style={{background:p.bg,padding:'10px 18px',textAlign:p.align}}>{['twitter','linkedin','facebook','instagram'].map(s=><span key={s} style={{display:'inline-block',margin:'0 3px',color:p.color,fontSize:10,border:`1px solid ${p.color}`,padding:'3px 8px',borderRadius:4}}>{s[0].toUpperCase()+s.slice(1)}</span>)}</div>;break;
    case'footer':inner=<div style={{background:p.bg,padding:'12px 18px',textAlign:p.align}}><div style={{color:p.color,fontSize:Math.min(p.fontSize,12)}}>{p.text}</div><div style={{marginTop:3,fontSize:10}}><a href="#" style={{color:p.color}}>{p.unsubscribe}</a></div></div>;break;
    case'html':inner=<div style={{position:'relative'}}><div style={{position:'absolute',top:4,right:4,background:'rgba(232,64,28,.9)',color:'#fff',fontSize:9,padding:'1px 5px',borderRadius:3,zIndex:2,pointerEvents:'none'}}>HTML</div><iframe srcDoc={`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif}</style></head><body>${p.code||''}</body></html>`} style={{width:'100%',minHeight:50,border:'none',display:'block'}} scrolling="no" onLoad={e=>{try{e.target.style.height=e.target.contentDocument.body.scrollHeight+'px';}catch{}}} title="html"/></div>;break;
  }
  return<div className={`eblock${sel?' sel':''}`} draggable onDragStart={() => onDragStart(block.id)} onClick={e=>{e.stopPropagation();onSel(block.id)}}>
    {inner}
    <div className="bctrl">
      {idx>0&&<button className="cbtn" title="Monter" onClick={e=>{e.stopPropagation();onUp(block.id)}}><i className="ti ti-arrow-up"/></button>}
      {idx<total-1&&<button className="cbtn" title="Descendre" onClick={e=>{e.stopPropagation();onDown(block.id)}}><i className="ti ti-arrow-down"/></button>}
      <button className="cbtn" title="Dupliquer" onClick={e=>{e.stopPropagation();onDup(block.id)}}><i className="ti ti-copy"/></button>
      <button className="cbtn red" title="Supprimer" onClick={e=>{e.stopPropagation();onDel(block.id)}}><i className="ti ti-trash"/></button>
    </div>
  </div>;
}

// Composants Formulaire
function ColorField({label,val,onChange}){return<div><label className="fl">{label}</label><div className="crow"><div className="csw"><input type="color" value={val} onChange={e=>onChange(e.target.value)}/></div><input className="fi" style={{flex:1,marginBottom:0}} type="text" value={val} onChange={e=>onChange(e.target.value)}/></div></div>;}
function TextField({label,val,onChange,type='text'}){return<div><label className="fl">{label}</label><input className="fi" type={type} value={val} onChange={e=>onChange(type==='number'?Number(e.target.value):e.target.value)}/></div>;}
function TextareaField({label,val,onChange,rows=3}){return<div><label className="fl">{label}</label><textarea className="fi" rows={rows} value={val} onChange={e=>onChange(e.target.value)}/></div>;}
function AlignBtns({val,onChange}){return<div><label className="fl">Alignement</label><div className="qbtn-row">{[['left','Gauche','ti-align-left'],['center','Centre','ti-align-center'],['right','Droite','ti-align-right']].map(([v,l,ic])=><button key={v} className={`qbtn${val===v?' on':''}`} onClick={()=>onChange(v)}><i className={`ti ${ic}`} style={{fontSize:11,verticalAlign:-1,marginRight:2}}/>{l}</button>)}</div></div>;}

  const TA=(label,k,rows=3)=><TextareaField label={label} val={p[k]} onChange={v=>s(k,v)} rows={rows}/>;
  const C=(label,k)=><ColorField label={label} val={p[k]} onChange={v=>s(k,v)}/>;

      {T('URL du logo','src')}{T('Texte alternatif','alt')}
      <label className="fl">Largeur du logo</label>
      <div className="qbtn-row" style={{marginBottom:8}}>{['120px','160px','180px','200px','240px'].map(w=><button key={w} className={`qbtn${p.width===w?' on':''}`} onClick={()=>s('width',w)}>{w}</button>)}</div>
      <input className="fi" type="text" placeholder="Autre ex: 300px" value={p.width} onChange={e=>s('width',e.target.value)}/>
      {AL()}{T('Lien (URL site)','link')}{T('Padding vertical (px)','padding','number')}{C('Fond du bloc','bg')}
    </>}
    {block.type==='image'&&<>
      <label className="fl">Disposition</label>
      <div className="qbtn-row" style={{marginBottom:10}}>
        {[['1','1 image','ti-square'],['2','2 colonnes','ti-columns-2'],['3','3 colonnes','ti-columns-2']].map(([v,l,ic])=>(
          <button key={v} className={`qbtn${String(p.cols||1)===v?' on':''}`} onClick={()=>s('cols',Number(v))} style={{display:'flex',alignItems:'center',justifyContent:'center',gap:4}}><i className={`ti ${ic}`} style={{fontSize:14}}/>{l}</button>
        ))}
      </div>
      {T("URL image principale",'src')}
      {(p.cols===2||p.cols===3)&&<TextField label="URL image 2" val={p.src2||''} onChange={v=>s('src2',v)}/>}
      {p.cols===3&&<TextField label="URL image 3" val={p.src3||''} onChange={v=>s('src3',v)}/>}
      {T('Texte alternatif','alt')}
      {(p.cols||1)===1&&<>
        <label className="fl">Largeur</label>
        <div className="qbtn-row" style={{marginBottom:8}}>{['100%','75%','50%','300px'].map(w=><button key={w} className={`qbtn${p.width===w?' on':''}`} onClick={()=>s('width',w)}>{w}</button>)}</div>
        <input className="fi" type="text" placeholder="Ex: 500px" value={p.width} onChange={e=>s('width',e.target.value)}/>
        {AL()}
      </>}
      {(p.cols===2||p.cols===3)&&<TextField label="Espace entre images (px)" val={p.gap||8} onChange={v=>s('gap',Number(v))} type="number"/>}

    {block.type==='button'&&<>{T('Texte','label')}{T('URL','url')}{C('Fond','bg')}{C('Texte','color')}{T('Taille','fontSize','number')}{T('Border radius','borderRadius','number')}{AL()}</>}
    {block.type==='divider'&&<>{C('Couleur','color')}{T('Epaisseur (px)','thickness','number')}{T('Padding (px)','padding','number')}</>}

    {block.type==='social'&&<>{T('Twitter','twitter')}{T('LinkedIn','linkedin')}{T('Facebook','facebook')}{T('Instagram','instagram')}{C('Fond','bg')}{C('Couleur','color')}{AL()}</>}

    {block.type==='footer'&&<>{TA('Texte','text')}{T('Lien désabo.','unsubscribe')}{C('Fond','bg')}{C('Texte','color')}{T('Taille','fontSize','number')}{AL()}</>}
  </div>;
}

function VarsPanel({toast}){
  const [search,setSearch]=useState('');

  const q=search.toLowerCase();
  const filtered=CRM_VARS.map(c=>({
    ...c, vars:c.vars.filter(v=>!q||v.label.toLowerCase().includes(q)||v.tag.toLowerCase().includes(q))
  })).filter(c=>c.vars.length>0);
  const copy=tag=>{navigator.clipboard.writeText(tag).catch(()=>{});toast(tag+' copié !');};
  
  return<div>
    <div className="s-search" style={{marginBottom:16}}>
      <i className="ti ti-search"/>
      <input placeholder="Chercher une variable..." value={search} onChange={e=>setSearch(e.target.value)}/>
    </div>
    {filtered.length===0&&<div style={{fontSize:12,color:'var(--t3)',textAlign:'center'}}>Aucune variable trouvée</div>}
    {filtered.map(cat=>{
      const isOpen=open[cat.cat]!==false;
      return<div key={cat.cat} style={{marginBottom:8}}>
        <button onClick={()=>setOpen(o=>({...o,[cat.cat]:!isOpen}))} style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'var(--bg-hover)',border:'1px solid var(--bd)',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:600,color:'var(--t)'}}>
          <i className={`ti ${cat.icon}`} style={{fontSize:16,color:'var(--ac)'}}/>
          {cat.cat}
          <span style={{marginLeft:'auto',fontSize:11,color:'var(--t3)'}}>{cat.vars.length}</span>
          <i className={`ti ${isOpen?'ti-chevron-up':'ti-chevron-down'}`} style={{fontSize:14,color:'var(--t3)'}}/>
        </button>
        {isOpen&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,padding:'8px 2px 4px'}}>
          {cat.vars.map(v=><button key={v.tag} title={v.tag} onClick={()=>copy(v.tag)} style={{display:'flex',flexDirection:'column',alignItems:'flex-start',padding:'6px 10px',background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:6,cursor:'pointer',textAlign:'left',gap:2,transition:'all .15s'}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--ac)';e.currentTarget.style.background='var(--ac-light)';}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bd)';e.currentTarget.style.background='var(--bg)';}}>
            <span style={{fontSize:11,fontWeight:600,color:'var(--t)',lineHeight:1.2}}>{v.label}</span>
            <span style={{fontSize:10,color:'var(--t3)',fontFamily:'monospace'}}>{v.tag}</span>
          </button>)}
        </div>}
      </div>;
    })}
  </div>;
}

function ExportModal({blocks,settings,onClose}){
  const [tab,setTab]=useState('preview');
  const html=buildEmail(blocks,settings,false);
  const htmlP=buildEmail(blocks,settings,true);
  const json=JSON.stringify({settings,blocks},null,2);
  const copy=txt=>navigator.clipboard.writeText(txt).catch(()=>alert('Copiez manuellement'));
  const dl=(c,n,t)=>{const a=document.createElement('a');a.href=`data:${t};charset=utf-8,`+encodeURIComponent(c);a.download=n;a.click();};
  return<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="mh">Exporter l'email</div>
    <div className="mtabs">{[['preview','Aperçu visuel'],['html','Code HTML'],['json','Format JSON']].map(([v,l])=><button key={v} className={`mtab${tab===v?' on':''}`} onClick={()=>setTab(v)}>{l}</button>)}</div>
    {tab==='preview'&&<iframe srcDoc={htmlP} style={{width:'100%',height:420,border:'1px solid var(--bd-dark)',borderRadius:8}} title="Aperçu"/>}
    {tab==='html'&&<pre>{html}</pre>}
    {tab==='json'&&<pre>{json}</pre>}
    <div className="mfoot">
      <button className="sbtn" onClick={onClose}>Fermer</button>
      {tab==='html'&&<><button className="sbtn" onClick={()=>copy(html)}><i className="ti ti-copy"/>Copier le code</button><button className="sbtn sbtn-ac" onClick={()=>dl(html,'email.html','text/html')}><i className="ti ti-download"/>Télécharger HTML</button></>}
      {tab==='json'&&<><button className="sbtn" onClick={()=>copy(json)}><i className="ti ti-copy"/>Copier JSON</button><button className="sbtn sbtn-ac" onClick={()=>dl(json,'email.json','application/json')}><i className="ti ti-download"/>Télécharger JSON</button></>}
    </div>
  </div></div>;
}

function SaveModal({onSave,onClose}){
  const [name,setName]=useState('');
  return<div className="overlay" onClick={onClose}><div className="modal-sm" onClick={e=>e.stopPropagation()}>
    <div className="mh">Sauvegarder</div>
    <div className="mh2">Donnez un nom à votre création pour la retrouver plus tard.</div>
    <input className="sinput" placeholder="Ex: Newsletter mai 2024" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&name.trim()&&onSave(name.trim())} autoFocus/>
    <div className="mfoot">
      <button className="sbtn" onClick={onClose}>Annuler</button>
      <button className="sbtn sbtn-ac" onClick={()=>name.trim()&&onSave(name.trim())} disabled={!name.trim()}><i className="ti ti-device-floppy"/>Enregistrer</button>
    </div>
  </div></div>;
}

function CreationsTab({creations,onLoad,onDelete,toast}){
  const [search,setSearch]=useState('');
  const filtered = creations.filter(c => c.name.toLowerCase().includes(search.toLowerCase()));

  return<>
    <div className="s-header">
      <div className="s-search">
        <i className="ti ti-search"/>
        <input placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
    </div>
    <div className="sbody">
      {!creations.length
        ? <div className="cempty"><i className="ti ti-inbox"/><p>Aucune création sauvegardée.</p></div>
        : filtered.length === 0 
          ? <div style={{fontSize:13, color:'var(--t3)', textAlign:'center', marginTop:20}}>Aucun résultat</div>
          : [...filtered].reverse().map(c=>{
              const fb=c.blocks&&c.blocks[0];const ac=(fb&&fb.props&&fb.props.bg)||'#E8401C';
              return<div key={c.id} className="ccard">
                <div className="tthumb"><div className="tbar" style={{background:ac,width:'100%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'72%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'52%'}}/><div className="tbar" style={{background:ac,width:46}}/></div>
                <div className="cmeta"><span className="cname" title={c.name}>{c.name}</span><div className="cacts"><button className="cact" title="Ouvrir" onClick={()=>onLoad(c)}><i className="ti ti-folder-open" style={{fontSize:16}}/></button><button className="cact del" title="Supprimer" onClick={()=>{if(window.confirm(`Supprimer "${c.name}" ?`)){onDelete(c.id);toast('Supprimé');}}}>  <i className="ti ti-trash" style={{fontSize:16}}/></button></div></div>
                <div className="cdate">{fmtDate(c.savedAt)}</div>
              </div>;
            })
      }
    </div>
  </>;
}

function ModulesTab({onInsert}){
  const [activeCat,setActiveCat]=useState('Tous');
  const [search,setSearch]=useState('');
  const cats=['Tous',...MODULE_CATS];
  
  const filtered = MODULES.filter(m => 
    (activeCat === 'Tous' || m.cat === activeCat) &&
    m.name.toLowerCase().includes(search.toLowerCase())
  );

  return<>
    <div className="s-header">
      <div className="s-search" style={{marginBottom:12}}>
        <i className="ti ti-search"/>
        <input placeholder="Rechercher..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="qbtn-row" style={{flexWrap:'nowrap', overflowX:'auto', paddingBottom:4}}>
        {cats.map(c=><button key={c} className={`qbtn${activeCat===c?' on':''}`} style={{flex:'none',padding:'6px 12px',borderRadius:20}} onClick={()=>setActiveCat(c)}>{c}</button>)}
      </div>
    </div>
    <div className="sbody">
      {filtered.length === 0 && <div style={{fontSize:13, color:'var(--t3)', textAlign:'center', marginTop:20}}>Aucun module trouvé</div>}
      {filtered.map(m=><div key={m.id} className="mcard" onClick={()=>onInsert(m)}>
        <div className="mcard-thumb" style={{fontSize:0,lineHeight:0,transform:'scale(0.5)',transformOrigin:'top left',width:'200%',height:'180px',pointerEvents:'none',userSelect:'none'}}>
          {m.preview}
        </div>
        <div className="mcard-label">
          <span className="mcard-name">{m.name}</span>
          <span className="mcard-tag">{m.tag}</span>
        </div>
      </div>)}
    </div>
  </>;
}

function App(){
  const loadDraft = () => { try { const draft = localStorage.getItem(DRAFT_KEY); if (draft) return JSON.parse(draft); } catch {} return TMPLS[0].blocks.map(b=>cloneB(b)); };

  const [blocks,setBlocks]=useState(loadDraft);
  const [settings,setSettings]=useState({subject:'',preheader:'',bgColor:'#f3f4f6'});
  const [sel,setSel]=useState(null);
  
  // Drag & Drop
  const [drag,setDrag]=useState(null);
  const [dragOver,setDragOver]=useState(null);
  
  // UI State
  const [showExport,setShowExport]=useState(false);
  const [showSave,setShowSave]=useState(false);
  const [sTab,setSTab]=useState('blocs');
  const [pTab,setPTab]=useState('props');
  const [view,setView]=useState('desktop');
  const [bSearch, setBSearch] = useState('');
  const [notif,setNotif]=useState('');
  const [creations,setCreations]=useState(()=>lsLoad());
  const timerRef=useRef();

  // Auto-save effect
  useEffect(() => { localStorage.setItem(DRAFT_KEY, JSON.stringify(blocks)); }, [blocks]);

  const toast=msg=>{setNotif(msg);clearTimeout(timerRef.current);timerRef.current=setTimeout(()=>setNotif(''),2400);};
  const selBlock=blocks.find(b=>b.id===sel)||null;

  const addBlock=(type,atIdx)=>{const nb={id:uid(),type,props:{...DEF[type]}};setBlocks(prev=>{const a=[...prev];a.splice(atIdx!=null?atIdx:a.length,0,nb);return a;});setSel(nb.id);};
  const insertModule=m=>{const nb={id:uid(),type:'html',props:{code:m.html}};setBlocks(p=>[...p,nb]);setSel(nb.id);toast(`Module "${m.name}" ajouté`);};
  const loadTpl=tpl=>{if(blocks.length>0&&!window.confirm("Remplacer l'email en cours par ce template ?"))return;setBlocks(tpl.blocks.map(b=>cloneB(b)));setSel(null);toast('Template chargé');};
  
  const moveBlockCanvas = (id, toIdx) => {
    setBlocks(prev => {
      const idx = prev.findIndex(b => b.id === id);
      if (idx < 0) return prev;
      const copy = [...prev];
      const [item] = copy.splice(idx, 1);
      const finalIdx = idx < toIdx ? toIdx - 1 : toIdx;
      copy.splice(finalIdx, 0, item);
      return copy;
    });
  };

  const onDrop=at=>{
    if(drag){
      if (drag.action === 'add') { addBlock(drag.payload, at); } 
      else if (drag.action === 'move') { moveBlockCanvas(drag.payload, at); }
      setDrag(null); setDragOver(null);
    }
  };

  const delBlock=id=>{setBlocks(p=>p.filter(b=>b.id!==id));if(sel===id)setSel(null);};
  const updBlock=(id,props)=>setBlocks(p=>p.map(b=>b.id===id?{...b,props}:b));
  const dupBlock=id=>{const i=blocks.findIndex(b=>b.id===id);if(i<0)return;const d=cloneB(blocks[i]);setBlocks(p=>{const a=[...p];a.splice(i+1,0,d);return a;});setSel(d.id);toast('Bloc dupliqué');};
  const moveUp=id=>setBlocks(p=>{const i=p.findIndex(b=>b.id===id);if(i<=0)return p;const a=[...p];[a[i-1],a[i]]=[a[i],a[i-1]];return a;});
  const moveDown=id=>setBlocks(p=>{const i=p.findIndex(b=>b.id===id);if(i>=p.length-1)return p;const a=[...p];[a[i],a[i+1]]=[a[i+1],a[i]];return a;});
  const handleSave=name=>{const e={id:String(Date.now()),name,savedAt:Date.now(),blocks:blocks.map(b=>cloneB(b)),settings};const u=[...creations,e];setCreations(u);lsSave(u);setShowSave(false);toast(`Création sauvegardée !`);};
  const handleLoad=c=>{if(blocks.length>0&&!window.confirm("Ouvrir cette sauvegarde ? Vous perdrez le brouillon en cours."))return;setBlocks(c.blocks.map(b=>cloneB(b)));if(c.settings)setSettings(c.settings);setSel(null);setSTab('blocs');toast(`"${c.name}" ouvert`);};
  const handleDelete=id=>{const u=creations.filter(c=>c.id!==id);setCreations(u);lsSave(u);};

  return<div className="app">
    <header className="topbar">
      <div className="logo-box">
        <svg width="32" height="32" viewBox="0 0 30 30" fill="none"><path d="M6 21 L10 11 L15 17 L19 12 L24 21" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      <div className="top-title">Pitlane Email Studio <span className="save-status"><span className={`dot ${blocks.length ? 'saved' : ''}`}/> {blocks.length ? 'Brouillon auto-sauvegardé' : 'Non sauvegardé'}</span></div>
      <div className="fx"/>
      <button className="tbtn" onClick={()=>{if(!blocks.length||window.confirm('Vider le canvas ?')){setBlocks([]);setSel(null);}}}><i className="ti ti-refresh"/> Vider</button>
      <button className="tbtn" onClick={()=>setShowSave(true)}><i className="ti ti-device-floppy"/> Enregistrer</button>
      <div className="vsep"/>
      <button className="tbtn tbtn-ac" onClick={()=>setShowExport(true)}><i className="ti ti-code"/> Exporter</button>
    </header>

    <nav className="rail">
      <button className={`rail-btn ${sTab==='blocs'?'on':''}`} title="Blocs" onClick={()=>setSTab('blocs')}><i className="ti ti-layout-grid-add"/></button>
      <button className={`rail-btn ${sTab==='modules'?'on':''}`} title="Modules" onClick={()=>setSTab('modules')}><i className="ti ti-puzzle"/></button>
      <button className={`rail-btn ${sTab==='templates'?'on':''}`} title="Templates" onClick={()=>setSTab('templates')}><i className="ti ti-layout-sidebar"/></button>
      <button className={`rail-btn ${sTab==='creations'?'on':''}`} title="Mes emails" onClick={()=>setSTab('creations')}>
        <i className="ti ti-folder"/>
        {creations.length>0&&<span className="rail-badge">{creations.length}</span>}
      </button>
    </nav>

    <aside className="sidebar">
      {sTab==='blocs'&&<>
        <div className="s-header">
          <div className="s-search">
            <i className="ti ti-search"/>
            <input placeholder="Rechercher un bloc..." value={bSearch} onChange={e=>setBSearch(e.target.value)}/>
          </div>
        </div>
        <div className="sbody">
          {BGROUPS.map(group => {
            const items = group.items.filter(item => item.label.toLowerCase().includes(bSearch.toLowerCase()));
            if (items.length === 0) return null;
            return <div key={group.label} className="s-group">
              <div className="s-group-title">{group.label}</div>
              {items.map(bt => (
                <div key={bt.type} className="bitem" draggable onDragStart={()=>setDrag({action:'add', payload: bt.type})} onDragEnd={()=>{setDrag(null);setDragOver(null);}} onClick={()=>addBlock(bt.type)}>
                  <i className={`ti ${bt.icon}`}/> {bt.label}
                  {bt.pro && <span className="pro-badge">Pro</span>}
                </div>
              ))}
            </div>
          })}
        </div>
      </>}
      {sTab==='modules'&&<ModulesTab onInsert={insertModule}/>}
      {sTab==='templates'&&<>
        <div className="s-header"><div className="s-group-title" style={{marginBottom:0}}>Templates autobiz</div></div>
        <div className="sbody">
          {TMPLS.map(t=><div key={t.name} className="tcard" onClick={()=>loadTpl(t)}><div className="tthumb"><div className="tbar" style={{background:t.color,width:'100%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'78%'}}/><div className="tbar" style={{background:'#d0d0d0',width:'58%'}}/><div className="tbar" style={{background:t.color,width:52}}/></div><div className="tlabel">{t.name}</div></div>)}
        </div>
      </>}
      {sTab==='creations'&&<CreationsTab creations={creations} onLoad={handleLoad} onDelete={handleDelete} toast={toast}/>}
    </aside>

    <main className="canvas" onClick={()=>setSel(null)}>
      <div className="ctop">
        <span style={{fontSize:13,fontWeight:500,color:'var(--t2)'}}>{view==='desktop'?'Aperçu Bureau':'Aperçu Mobile'}</span>
        <div className="vtog">
          <button className={`vtab${view==='desktop'?' on':''}`} onClick={()=>setView('desktop')}><i className="ti ti-device-laptop"/> Desktop</button>
          <button className={`vtab${view==='mobile'?' on':''}`} onClick={()=>setView('mobile')}><i className="ti ti-device-mobile"/> Mobile</button>
        </div>
      </div>
      <div className="ewrap" style={{width:view==='desktop'?600:375}}>
        {!blocks.length
          ?<div className="eempty"><i className="ti ti-layout-board-split"/><p>Glissez un bloc ici ou cliquez dans la barre de gauche pour démarrer</p></div>
          :<>
            <div className={`dzone${dragOver===0?' over':''}`} style={{minHeight:drag?30:6}} onDragOver={e=>{e.preventDefault();setDragOver(0)}} onDragLeave={()=>setDragOver(null)} onDrop={()=>onDrop(0)}/>
            {blocks.map((b,i)=><React.Fragment key={b.id}>
              <BView block={b} sel={sel===b.id} onSel={setSel} onDel={delBlock} onUp={moveUp} onDown={moveDown} onDup={dupBlock} idx={i} total={blocks.length} onDragStart={(id) => setDrag({action: 'move', payload: id})} />
              <div className={`dzone${dragOver===i+1?' over':''}`} style={{minHeight:drag?30:6}} onDragOver={e=>{e.preventDefault();setDragOver(i+1)}} onDragLeave={()=>setDragOver(null)} onDrop={()=>onDrop(i+1)}/>
            </React.Fragment>)}
          </>
        }
      </div>
    </main>

    <aside className="panel">
      <div className="ptabs">
        <button className={`ptab${pTab==='props'?' on':''}`} onClick={()=>setPTab('props')}><i className="ti ti-settings" style={{marginRight:6, fontSize:14, verticalAlign:-2}}/>Propriétés</button>
        <button className={`ptab${pTab==='vars'?' on':''}`} onClick={()=>setPTab('vars')}><i className="ti ti-braces" style={{marginRight:6, fontSize:14, verticalAlign:-2}}/>Variables</button>
      </div>
      <div className="pb">
        {pTab==='props'&&(selBlock?<PropPanel block={selBlock} onChange={updBlock} toast={toast}/>:<EmailSettings settings={settings} onChange={setSettings}/>)}
        {pTab==='vars'&&<VarsPanel toast={toast}/>}
      </div>
    </aside>

    {showExport&&<ExportModal blocks={blocks} settings={settings} onClose={()=>setShowExport(false)}/>}
    {showSave&&<SaveModal onSave={handleSave} onClose={()=>setShowSave(false)}/>}
    <div className={`notif${notif?' show':''}`}>{notif}</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
